# Author
author:
  name: "Meryem M'hamdi"
  image: 'authorimage2.png'
  greetings: 'Hi!'
  description: >-
    <p>I'm Meryem M'hamdi, a Computer Science PhD graduate from
    the University of Southern California (USC), specializing
    in Natural Language Processing, multilingual learning,
    and large language models.</p>

    <p>My research focuses on developing more adaptive and
    generalizable AI systems through meta-learning, continual
    learning, and cross-lingual transfer learning. My work
    has been published at ACL, NAACL, and SIGIR.</p>

    <p>Beyond academia, I have worked with Adobe Research,
    Microsoft, and Meta, contributing to projects spanning
    semantic retrieval, recommendation systems, LLM evaluation,
    alignment, and human-centered AI.</p>

    <p>I'm interested in bridging foundational AI research
    with real-world applications to build intelligent systems
    that are reliable, adaptable, and accessible across
    languages and cultures.</p>

  bio: 'Prior to joining ISI, Meryem holds a Master in Computer Science from <a href=https://www.epfl.ch/> Ecole Polytechnique Federale de Lausanne (EPFL) </a>
  in Swizerland and is currently pursuing her PhD in Computer Science with special focus on Natural Language Processing in
  <a href=https://www.usc.edu/> University of Southern California (USC) </a> in Los Angeles. Her research aspirations come
  from her passion for learning new languages and discovering new cultures through traveling. '

